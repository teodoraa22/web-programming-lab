<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title th:text="${workshop} ? 'Edit workshop' : 'Add new workshop'">Workshop</title>
    <style type="text/css">
        body {
            width: 600px;
            margin: auto;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        .field {
            margin: 12px 0;
        }
        label {
            display: block;
            margin-bottom: 4px;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
<h1 th:text="${workshop} ? 'Edit workshop' : 'Add new workshop'"></h1>

<form method="POST"
      th:action="${workshop} ? @{/workshops/edit/{id}(id=${workshop.id})} : @{/workshops/add}">

    <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" th:value="${workshop?.title}">
    </div>

    <div class="field">
        <label for="category">Category</label>
        <input type="text" id="category" name="category" th:value="${workshop?.category}">
    </div>

    <div class="field">
        <label for="price">Price</label>
        <input type="number" id="price" name="price" min="0" step="0.01" required
               th:value="${workshop?.price}">
    </div>

    <div class="field">
        <label for="capacity">Capacity</label>
        <input type="number" id="capacity" name="capacity" min="0" required
               th:value="${workshop?.capacity}">
    </div>

    <!-- се прикажува име и презиме, се праќа id -->
    <div class="field">
        <label for="instructorId">Instructor</label>
        <select id="instructorId" name="instructorId">
            <option th:each="i : ${instructors}"
                    th:value="${i.id}"
                    th:text="${i.name + ' ' + i.surname}"
                    th:selected="${workshop?.instructor?.id == i.id}"></option>
        </select>
    </div>

    <input type="submit" value="Save">
    <a th:href="@{/workshops}">Cancel</a>
</form>
</body>
</html>
